# Add this block INSIDE the existing `server { ... }` block for
# oncotraceai.org (the one that already has `location / { root
# /var/www/oncotraceai; ... }` in it) -- do not create a second server block.
#
# Find the file with: sudo nginx -T | grep -B5 "server_name oncotraceai.org"
# Then: sudo nano <that file>, paste this inside the server{} block, save, and:
#   sudo nginx -t && sudo systemctl reload nginx

    # Reverse-proxy to the OncoTrace-AI analysis backend (systemd unit
    # oncotrace-backend, listening on 127.0.0.1:8000). Same-origin from the
    # browser's point of view, so no CORS configuration is needed.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A real VCF analysis can legitimately take a couple of minutes
        # (SnpEff/bcftools subprocesses) -- nginx's 60s default read timeout
        # would otherwise return a 504 to the browser while the backend is
        # still working.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Must be at least as large as the backend's own ONCOTRACE_MAX_UPLOAD_BYTES
    # (500 MB) -- nginx's default (1 MB) would reject real VCF uploads with a
    # 413 before they ever reach the backend. This applies to the whole
    # server{} block, so put it at the top level of that block, not just
    # inside location /api/.
    client_max_body_size 500M;
