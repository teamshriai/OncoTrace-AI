# nginx configuration for the OncoTrace-AI analysis backend.
#
# Two parts:
#   PART 1 goes at http{} level (i.e. in /etc/nginx/nginx.conf, or a file in
#          /etc/nginx/conf.d/) -- rate-limit zones must be declared there.
#   PART 2 goes INSIDE the existing `server { ... }` block for oncotraceai.org
#          (the one that already has `location / { root /var/www/oncotraceai; }`)
#          -- do not create a second server block.
#
# Find the server block with: sudo nginx -T | grep -B5 "server_name oncotraceai.org"
# Then edit, paste, and apply with:
#   sudo nginx -t && sudo systemctl reload nginx


# ============================================================================
# PART 1 -- http{} level. Rate-limit zones.
# ============================================================================
#
# The demo is guarded by ONE shared credential, which is inherently
# brute-forceable: without a limit an attacker can try passwords as fast as the
# network allows, and /auth/verify is a perfect oracle (200 vs 401). These two
# zones are the difference between "a few guesses a minute" and "millions".
#
# 10m of shared memory holds roughly 160k distinct client IPs per zone.

limit_req_zone $binary_remote_addr zone=oncotrace_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=oncotrace_api:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr zone=oncotrace_conn:10m;


# ============================================================================
# PART 2 -- inside server { ... } for oncotraceai.org
# ============================================================================

    # ---- Security headers -------------------------------------------------
    # HSTS: only enable once HTTPS is confirmed working, and note that browsers
    # remember it for a year -- a broken certificate after this is set makes the
    # site unreachable rather than merely untrusted.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- Sign-in endpoint: strictest limit ---------------------------------
    # Separate block so credential guessing is throttled far harder than normal
    # API traffic. 5r/m + burst=3 means a brute-forcer gets ~8 attempts in the
    # first minute and 5/min after -- slow enough to be useless, generous enough
    # that a real user fat-fingering their password is never blocked.
    #
    # It carries no request body, so the body limit is tiny here: this endpoint
    # must never be usable to push megabytes at the server.
    location = /api/v1/auth/verify {
        limit_req  zone=oncotrace_auth burst=3 nodelay;
        limit_conn oncotrace_conn 10;
        limit_req_status 429;

        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8000/api/v1/auth/verify;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Analysis + everything else under /api/ ---------------------------
    location /api/ {
        limit_req  zone=oncotrace_api burst=20 nodelay;
        limit_conn oncotrace_conn 10;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A real VCF analysis can legitimately take a couple of minutes
        # (SnpEff/bcftools subprocesses) -- nginx's 60s default read timeout
        # would otherwise return a 504 to the browser while the backend is
        # still working.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Must be at least as large as the backend's own ONCOTRACE_MAX_UPLOAD_BYTES
    # (500 MB) -- nginx's default (1 MB) would reject real VCF uploads with a
    # 413 before they ever reach the backend. This applies to the whole
    # server{} block, so put it at the top level of that block; the /auth/
    # location above deliberately overrides it with a much smaller value.
    client_max_body_size 500M;


# ============================================================================
# TLS -- REQUIRED before going live
# ============================================================================
#
# The demo credential is sent as base64 in an Authorization header. Base64 is
# encoding, NOT encryption: over plain HTTP anyone on the network path reads the
# password in clear text. Do not launch without TLS.
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d oncotraceai.org -d www.oncotraceai.org
#
# Certbot adds the certificate directives and an HTTP->HTTPS redirect. Confirm
# the redirect exists afterwards:
#
#   curl -sI http://oncotraceai.org | head -1     # expect 301
#
# Renewal is handled by certbot's systemd timer; verify with:
#   sudo systemctl list-timers | grep certbot
