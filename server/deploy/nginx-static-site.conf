# nginx configuration for serving the built React app (client/dist) fast on a
# small instance (this was written for an AWS t3.large: 2 vCPU / 8 GB RAM).
#
# Goes INSIDE the same `server { ... }` block as nginx-api-location.conf, i.e.
# the block with `server_name oncotraceai.org` and `root /var/www/oncotraceai`.
# Apply with: sudo nginx -t && sudo systemctl reload nginx


    # ---- Compression --------------------------------------------------
    # The JS bundle is ~2MB uncompressed; gzip typically gets text assets to
    # 25-30% of that. This is the single highest-value nginx setting for a
    # React SPA and is NOT on by default.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/wasm image/svg+xml;
    # Skip: images/fonts/video are already compressed formats (webp, woff2,
    # glb) -- gzipping them again wastes CPU on a 2-vCPU box for no size gain.

    # ---- Long-lived caching for hashed build assets --------------------
    # Vite writes a content hash into every filename under /assets/
    # (index-CUbIfF8V.js). A file at that exact URL never changes, so it is
    # safe to cache for a year; a new deploy produces a new filename, not a
    # stale cache hit. This is what makes repeat visits nearly free.
    location /assets/ {
        root /var/www/oncotraceai;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Large static media referenced directly by filename (not content-hashed):
    # cache for a week rather than forever, so an updated file is picked up
    # without needing a cache-buster query string.
    location ~* \.(?:webp|jpg|jpeg|png|gif|glb|woff2?|ttf|ico)$ {
        root /var/www/oncotraceai;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---- SPA fallback ---------------------------------------------------
    # react-router uses BrowserRouter (real paths like /blog/some-post, not
    # /#/blog/some-post). Without this, refreshing on any non-root route, or
    # opening a shared link to one, 404s at the nginx level before React Router
    # ever runs. try_files must come LAST among the location blocks that could
    # match a given path, since nginx picks the most specific matching block.
    location / {
        root /var/www/oncotraceai;
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached, or a new deploy won't be
        # visible until the cache expires -- it's what points the browser at
        # the current hashed asset filenames in the first place.
        add_header Cache-Control "no-cache" always;
    }
